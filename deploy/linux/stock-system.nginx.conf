# A股智能选股系统 - nginx 站点配置
# 用法：复制到 /etc/nginx/sites-available/stock-system，
#       再 ln -s 到 /etc/nginx/sites-enabled/，删掉默认站点后 reload。
# 若服务器已有 default_server，请去掉下面 listen 行的 default_server。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 前端静态目录（Vue 单页 + 本地 vendor，无需 Node 构建）
    root /opt/stocksystem/stock_system/web;
    index index.html;

    # 开启压缩：全历史K线接口一次会返回 8000+ 根、约 3.5MB JSON，
    # gzip 后只有 0.5MB 左右。nginx 默认只压 text/html，application/json 必须显式列出。
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # 后端 API：原样转发，保留 /api 前缀到 uvicorn(127.0.0.1:8800)
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 后端未自带压缩，交给 nginx 统一处理大 JSON
        proxy_set_header Accept-Encoding "";
    }

    # 健康检查端点（在后端根路径 /health，不在 /api 下）
    location = /health {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
    }

    # 前端单页应用回退：找不到的文件都交给 index.html
    # （Vue 用 hash 路由 #watch/#data，刷新任意子路径都不会 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
